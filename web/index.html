<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3b6ef6" />
<meta name="description" content="本地优先的日程表与课表应用" />
<!-- iOS：添加到主屏幕后全屏运行、状态栏透明 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="日程表" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>日程表 · Timetable</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
<!-- iOS 主屏图标：180×180 是 iOS 惯例尺寸；192 作为备选 -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/views.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div id="app" class="app" aria-busy="true">
  <!-- 桌面端左侧导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">日</span>
      <span class="brand-text">
        <b>日程表</b>
        <small>Timetable</small>
      </span>
    </div>
    <nav class="nav" id="nav-desk" aria-label="主导航"></nav>
    <div class="sidebar-foot">
      <!-- ⚠️ 这里原来还有一个写死的「⚙ 设置」按钮，而 app.js 的 tools 列表里
           已经包含 settingsView —— 于是侧栏出现**两个设置**（用户报的 bug）。
           工具入口统一由 app.js 注入，这里不再重复。 -->
      <p class="tiny" id="sidebar-status">连接中…</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn only-mobile" data-action="open-settings" aria-label="设置">☰</button>
        <div class="title-block">
          <h1 id="view-title">月历</h1>
          <p class="subtitle" id="view-subtitle"></p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="period-nav" id="period-nav"></div>
        <button class="btn btn-primary new-event-btn" data-action="new-event">
          <span aria-hidden="true">＋</span><span class="only-desk">新建日程</span>
        </button>
      </div>
    </header>

    <!-- 提醒 / 权限提示条 -->
    <div id="banner-host" class="banner-host"></div>

    <main class="content" id="view-host" tabindex="-1"></main>
  </div>

  <!-- 手机端底部标签栏 -->
  <nav class="tabbar" id="nav-mobile" aria-label="主导航"></nav>
</div>

<div class="modal-host" id="modal-host" hidden></div>
<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="/ui/app.js"></script>
</body>
</html>
