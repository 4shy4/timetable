# 安卓壳子的 Gradle 属性。
# 这些开关是 AGP 8.x 的常规要求，缺了会在配置阶段就报错。

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 项目路径里有中文（"日程表（Timetable）"），AGP 默认会直接拒绝构建。
# 打开这个开关后才允许继续 —— 见 docs/ANDROID-BUILD.md 里记的坑。
android.overridePathCheck=true

# 非 ASCII 路径下，aapt2/资源处理容易出问题，关掉增量资源合并更稳
android.enableResourceOptimizations=false

# 用 AndroidX（AGP 8 必须显式打开）
android.useAndroidX=true
android.enableJetifier=false

# Kotlin 官方代码风格
kotlin.code.style=official

# 只用 arm64 + x86_64 之外的 ABI 不需要（本项目没有 native 代码，此项仅影响打包体积无关）
android.nonTransitiveRClass=true

# 允许在无网络时使用缓存（配合 --offline 构建）
org.gradle.caching=true
org.gradle.parallel=true
